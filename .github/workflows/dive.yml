name: dive-alert

on:
  schedule:
    # LESSON (2026-08-14, learned in production): GitHub fires crons up to
    # HOURS late, and an exact-hour guard silently skipped the run each time.
    # Bellwatch caught the resulting two-day silence. Now: one cron per slot,
    # a WIDE local-hour window per slot, and windows sized so PST/PDT drift
    # and multi-hour lateness both land inside them.
    - cron: "30 11 * * *"  # morning: 4:30am PDT / 3:30am PST -> window 3-5
    - cron: "0 23 * * *"   # evening: 4pm PDT / 3pm PST -> window 14-19.
                           # Deliberately early: at 6pm the next dawn sat at
                           # ~12.2h lead, a 20-min-late cron lost the morning
                           # alert entirely. From 4pm, dawn is ~14h out and
                           # hours of lateness still clear the 12h floor.
    - cron: "30 18 * * *"  # ingest: 11:30am PDT / 10:30am PST -> window 10-13
    - cron: "30 14 * * 3"  # weekly: Wed 7:30am PDT / 6:30am PST -> window 6-9
  workflow_dispatch: {}    # manual runs always allowed

permissions:
  contents: write

concurrency:
  group: dive-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pacific-window guard (lateness-tolerant)
        id: guard
        run: |
          H=$(TZ=America/Los_Angeles date +%-H)
          DOW=$(TZ=America/Los_Angeles date +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          elif [ "$DOW" = "3" ] && [ "$H" -ge 6 ] && [ "$H" -le 9 ]; then
            echo "go=weekly" >> "$GITHUB_OUTPUT"   # Wednesday: the week-ahead ritual
          elif [ "$H" -ge 3 ] && [ "$H" -le 5 ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"      # the dawn read
          elif [ "$H" -ge 14 ] && [ "$H" -le 19 ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"      # the afternoon read
          elif [ "$H" -ge 10 ] && [ "$H" -le 13 ]; then
            echo "go=ingest" >> "$GITHUB_OUTPUT"   # midday: fold in button presses
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "Skipping: local hour $H outside every window."
          fi

      - name: Run dive_alert
        if: steps.guard.outputs.go == 'yes'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
        run: python dive_alert.py run

      - name: Weekly digest
        if: steps.guard.outputs.go == 'weekly'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: python dive_alert.py run --weekly

      - name: Ingest feedback only
        if: steps.guard.outputs.go == 'ingest'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python dive_alert.py ingest

      - name: Commit data back
        # [skip ci] both avoids loops and keeps the repo active so GitHub's
        # 60-day scheduled-workflow auto-disable never triggers.
        if: steps.guard.outputs.go != 'no'
        run: |
          git config user.name "dive-alert bot"
          git config user.email "actions@users.noreply.github.com"
          # -A, not data/: the run also rewrites the per-bell share cards
          # (*/index.html). Leaving them unstaged made pull --rebase refuse
          # ("unstaged changes") and killed every run with exit 128.
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "data: scored windows $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          # a human may push while a 15-bell run is in flight; on conflict the
          # replayed bot commit (generated files, newest state) wins, and the
          # push retries the race up to three times
          for i in 1 2 3; do
            git pull --rebase -X theirs origin ${{ github.ref_name }} || { git rebase --abort || true; sleep 5; continue; }
            git push && exit 0
            sleep 5
          done
          echo "could not land the data commit after 3 attempts"
          exit 1
