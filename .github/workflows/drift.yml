name: drift

# The model's 20-year memory. Monthly: hold the swell model against the last
# 45 days of buoy truth (has the upstream model quietly changed?), and grade
# every promise against every diver verdict (is the score still honest?).
# Findings arrive as bell messages and PROPOSALS — the model never edits
# itself. Sparse, selection-biased labels make silent autotune a trap; a
# human turns the ratchet, the logs make the case.

on:
  schedule:
    - cron: "0 17 3 * *"   # 3rd of each month, ~9-10am Pacific
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate every bell against its own buoy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          for Z in A D E F H I J K; do
            python dive_alert.py validate --zone $Z --notify || true
          done
      - name: Grade the bell's own foresight
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python dive_alert.py skill --notify

      - name: Grade the bell's promises
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python dive_alert.py report --notify
      - name: Commit the drift log
        run: |
          git config user.name "dive-alert bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: drift + record $(date -u +%Y-%m) [skip ci]"
          git pull --rebase origin main
          git push
